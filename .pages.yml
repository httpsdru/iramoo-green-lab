media: assets/images
 
content:
  - name: site-content
    label: Site Content
    path: content.json
    type: file
    format: json
    fields:
 
      - name: acknowledgement
        label: Acknowledgement of Country
        type: object
        fields:
          - { name: label, label: Heading label, type: string }
          - { name: body, label: Body text, type: text }
          - { name: buttonText, label: Button text, type: string }
          - { name: artwork, label: Artwork image, type: image }
          - { name: caption, label: Artwork caption, type: string }
 
      - name: about
        label: About (intro paragraph)
        type: object
        fields:
          - { name: text, label: Text, type: text }
 
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: address, label: Address, type: string }
          - { name: addressLink, label: Address link (Google Maps URL), type: string }
          - { name: phone, label: Phone, type: string }
          - { name: email, label: Email, type: string }
          - { name: credit, label: Footer credit line, type: text }
 
      - name: grasslands
        label: Grasslands
        type: object
        fields:
          - name: blocks
            label: Content blocks
            type: object
            list: true
            fields:
              - { name: type, label: Block type, type: select, options: { values: [intro, heading, text, list, image] } }
              - { name: text, label: Text, type: text }
              - { name: header, label: List header (optional), type: string }
              - { name: image, label: Image, type: image }
              - { name: caption, label: Image caption, type: string }
 
      - name: research
        label: Research
        type: object
        fields:
          - name: blocks
            label: Content blocks
            type: object
            list: true
            fields:
              - { name: type, label: Block type, type: select, options: { values: [intro, heading, text, list, image] } }
              - { name: text, label: Text, type: text }
              - { name: header, label: List header (optional), type: string }
              - { name: image, label: Image, type: image }
              - { name: caption, label: Image caption, type: string }
 
      - name: education
        label: Education
        type: object
        fields:
          - name: blocks
            label: Content blocks
            type: object
